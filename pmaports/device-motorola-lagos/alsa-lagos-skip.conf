# The codec's volume controls read back 0x1f (mute) while powered down, so a
# stored ALSA state restores them muted, and "alsactl init" resets the route.
# lagos-audio-setup sets the mixer explicitly instead. udev pulls this unit in
# for every new card, so disabling it isn't enough: skip it.
[Unit]
ConditionPathExists=!/usr/bin/lagos-audio-setup
