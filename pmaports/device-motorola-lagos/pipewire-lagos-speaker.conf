# The kernel has no per-PCM /proc/asound entries, so PipeWire's ALSA monitor
# sees this card with zero PCMs and skips it. Declare the speaker/headset
# output (Playback_1 -> ADDA -> MT6358) as a fixed sink instead; this also
# keeps PipeWire away from the BTCVSD/hostless PCMs, which crash the phone.
context.objects = [
    {   factory = adapter
        args = {
            factory.name     = api.alsa.pcm.sink
            node.name        = "lagos-speaker"
            node.description = "Speaker"
            media.class      = "Audio/Sink"
            api.alsa.path    = "hw:0,0"
            audio.format     = "S16LE"
            audio.rate       = 48000
            audio.channels   = 2
            audio.position   = [ FL FR ]
            priority.session = 1000
            priority.driver  = 1000
        }
    }
]
