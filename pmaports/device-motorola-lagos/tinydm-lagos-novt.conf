# The stock GKI kernel has CONFIG_VT unset: run the session on seat0 with no tty
[Unit]
ConditionPathExists=
# No VTs, so there is no getty to fall back to
OnFailure=

[Service]
TTYPath=
TTYReset=no
TTYVHangup=no
TTYVTDisallocate=no
StandardInput=null
# No GPU driver: wlroots has to render in software
Environment=XDG_SEAT=seat0 XDG_SESSION_TYPE=wayland XDG_SESSION_CLASS=user WLR_RENDERER=pixman
SuccessExitStatus=143
