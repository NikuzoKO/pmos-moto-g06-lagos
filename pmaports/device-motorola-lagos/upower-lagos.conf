# The stock kernel has no user namespaces, so PrivateUsers=yes fails with
# "Failed to set up user namespacing"
[Service]
PrivateUsers=no

# Without fuelgauged the battery reads capacity -1: upower takes that as an
# empty battery and runs the critical action (it powered the phone off)
[Unit]
Requires=lagos-fuelgauged.service
After=lagos-fuelgauged.service
