# kitty on the phone (~/.config/kitty/kitty.conf). Rosé Pine (main), like the
# bars, nav bar and launcher; slightly translucent so the wallpaper shows.

font_family      Roboto Mono
font_size        11.0
# no ligatures/fancy shaping work wasted on the CPU renderer path
disable_ligatures always

background_opacity 0.88
# lets "kitty @ set-background-opacity" / ctrl+shift+a,m|l adjust it live
dynamic_background_opacity yes

window_padding_width 6
hide_window_decorations yes
confirm_os_window_close 0
enable_audio_bell no
visual_bell_duration 0
cursor_shape beam
cursor_blink_interval 0
scrollback_lines 5000
# touch: no accidental selections copying over the clipboard
copy_on_select no
update_check_interval 0

# Rosé Pine
foreground           #e0def4
background           #191724
selection_foreground #e0def4
selection_background #403d52
cursor               #524f67
cursor_text_color    #e0def4
url_color            #c4a7e7

active_tab_foreground   #e0def4
active_tab_background   #26233a
inactive_tab_foreground #6e6a86
inactive_tab_background #191724
active_border_color     #31748f
inactive_border_color   #403d52

# black
color0  #26233a
color8  #6e6a86
# red
color1  #eb6f92
color9  #eb6f92
# green
color2  #31748f
color10 #31748f
# yellow
color3  #f6c177
color11 #f6c177
# blue
color4  #9ccfd8
color12 #9ccfd8
# magenta
color5  #c4a7e7
color13 #c4a7e7
# cyan
color6  #ebbcba
color14 #ebbcba
# white
color7  #e0def4
color15 #e0def4

# Touch: sway emulates a left-button drag for every finger drag (kitty has no
# wl_touch), so left-button selection would fire on each scroll swipe. Selection
# comes from lagos-touchscroll's hold gesture instead, sent as the middle button.
mouse_map left press ungrabbed discard_event
mouse_map left doublepress ungrabbed discard_event
mouse_map left triplepress ungrabbed discard_event
mouse_map middle press ungrabbed mouse_selection normal
mouse_map middle release ungrabbed discard_event
