<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Roboto Mono for every generic family, like the desktop's shell font;
     the Nerd Font behind it covers icon glyphs -->
<fontconfig>
    <alias binding="strong">
        <family>sans-serif</family>
        <prefer><family>Roboto Mono</family><family>Dejavu Sans Mono Nerd Font</family></prefer>
    </alias>
    <alias binding="strong">
        <family>serif</family>
        <prefer><family>Roboto Mono</family><family>Dejavu Sans Mono Nerd Font</family></prefer>
    </alias>
    <alias binding="strong">
        <family>monospace</family>
        <prefer><family>Roboto Mono</family><family>Dejavu Sans Mono Nerd Font</family></prefer>
    </alias>
</fontconfig>
