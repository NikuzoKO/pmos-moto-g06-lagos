# Rosé Pine notifications, matching the desktop
[global]
    font = "Roboto Mono 11"
    frame_width = 2
    corner_radius = 8
    separator_color = frame

[urgency_low]
    background = "#191724"
    foreground = "#908caa"
    frame_color = "#403d52"

[urgency_normal]
    background = "#191724"
    foreground = "#e0def4"
    frame_color = "#c4a7e7"

[urgency_critical]
    background = "#191724"
    foreground = "#e0def4"
    frame_color = "#eb6f92"
