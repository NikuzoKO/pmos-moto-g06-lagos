# Rosé Pine notifications, matching the desktop: borderless pills in the status
# bar islands' colour, top left, the full width between the same insets the
# islands keep from the screen's rounded corners (see lagos-statusbar). Offsets
# count from below the status bar's reserved strip.
[global]
    font = "Roboto Mono 11"
    origin = top-left
    offset = (6, 4)
    width = 348
    frame_width = 0
    corner_radius = 22
    gap_size = 4
    padding = 11
    horizontal_padding = 16
    text_icon_padding = 12
    separator_height = 0

[urgency_low]
    background = "#191724"
    foreground = "#908caa"

[urgency_normal]
    background = "#191724"
    foreground = "#e0def4"

[urgency_critical]
    background = "#191724"
    foreground = "#eb6f92"
