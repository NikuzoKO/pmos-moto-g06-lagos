# Volume channels on top of the speaker (Android-style): the hardware sink
# "lagos-speaker" stays at 100 %, apps play into one of these virtual sinks,
# each with its own volume. Media is the default sink, so sxmo's volume keys
# and audio menu (pactl @DEFAULT_SINK@) only touch media; notification, SMS
# and ring sounds play into "lagos-notify" (mpv --audio-device=pipewire/lagos-notify);
# "lagos-alarm" and "lagos-system" are the alarm and system-sound channels.
# Per-channel sound/vibrate/mute state lives in lagos-sound.
context.modules = [
    {   name = libpipewire-module-loopback
        args = {
            node.description = "Media"
            capture.props = {
                node.name        = "lagos-media"
                media.class      = "Audio/Sink"
                audio.position   = [ FL FR ]
                priority.session = 2000
            }
            playback.props = {
                node.name      = "lagos-media.out"
                target.object  = "lagos-speaker"
                node.passive   = true
                node.dont-reconnect = true
                audio.position = [ FL FR ]
            }
        }
    }
    {   name = libpipewire-module-loopback
        args = {
            node.description = "Notifications"
            capture.props = {
                node.name        = "lagos-notify"
                media.class      = "Audio/Sink"
                audio.position   = [ FL FR ]
                priority.session = 1500
            }
            playback.props = {
                node.name      = "lagos-notify.out"
                target.object  = "lagos-speaker"
                node.passive   = true
                node.dont-reconnect = true
                audio.position = [ FL FR ]
            }
        }
    }
    {   name = libpipewire-module-loopback
        args = {
            node.description = "Alarms"
            capture.props = {
                node.name        = "lagos-alarm"
                media.class      = "Audio/Sink"
                audio.position   = [ FL FR ]
                priority.session = 1400
            }
            playback.props = {
                node.name      = "lagos-alarm.out"
                target.object  = "lagos-speaker"
                node.passive   = true
                node.dont-reconnect = true
                audio.position = [ FL FR ]
            }
        }
    }
    {   name = libpipewire-module-loopback
        args = {
            node.description = "System"
            capture.props = {
                node.name        = "lagos-system"
                media.class      = "Audio/Sink"
                audio.position   = [ FL FR ]
                priority.session = 1300
            }
            playback.props = {
                node.name      = "lagos-system.out"
                target.object  = "lagos-speaker"
                node.passive   = true
                node.dont-reconnect = true
                audio.position = [ FL FR ]
            }
        }
    }
]
