# ~/.config/xdg-desktop-portal/sway-portals.conf
# Stock sway choice (wlr, then gtk) plus Phosh's adaptive file chooser
# (xdg-desktop-portal-phosh's phrosh backend): GTK's own file dialog has a
# minimum size wider than this 360 px screen.
[preferred]
default=wlr;gtk
org.freedesktop.impl.portal.FileChooser=phrosh
